name: Deploy Portal Live

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Git ref to deploy
        required: false
        default: release/live
  push:
    branches:
      - release/live

concurrency:
  group: portal-live-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}

      - name: Guard production deploy ref
        if: github.event_name == 'workflow_dispatch'
        run: |
          selected_ref="${{ inputs.ref }}"
          selected_ref="${selected_ref#refs/heads/}"
          if [[ "$selected_ref" != "release/live" ]]; then
            echo "Production deploy is locked to release/live (got: $selected_ref)" >&2
            exit 1
          fi

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          tools: composer:v2
          coverage: none

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install root frontend dependencies
        run: npm ci

      - name: Install Composer dependencies
        run: |
          composer_dirs=(
            application
            modules/einvoice
            modules/openai
            modules/surveys
            modules/woocommerce
          )

          for dir in "${composer_dirs[@]}"; do
            if [[ -f "$dir/composer.json" ]]; then
              composer install \
                --working-dir="$dir" \
                --no-dev \
                --prefer-dist \
                --no-interaction \
                --optimize-autoloader
            fi
          done

      - name: Rebuild minified CSS
        run: npx grunt cssmin

      - name: Compute release id
        id: release
        run: echo "release_id=$(date -u +%Y%m%d-%H%M%S)-gha-${GITHUB_RUN_ID}" >> "$GITHUB_OUTPUT"

      - name: Package release artifact
        id: package
        run: |
          archive_path="$(OUTPUT_DIR="$PWD/release-artifacts" RELEASE_ID="${{ steps.release.outputs.release_id }}" bash scripts/package-release.sh)"
          echo "archive_path=$archive_path" >> "$GITHUB_OUTPUT"

      - name: Prepare SSH key
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "${{ secrets.PROD_SSH_KEY }}" > ~/.ssh/portal_live_deploy_ed25519
          chmod 600 ~/.ssh/portal_live_deploy_ed25519
          ssh-keyscan -H "${{ secrets.PROD_SSH_HOST }}" >> ~/.ssh/known_hosts

      - name: Upload release archive
        run: |
          scp -i ~/.ssh/portal_live_deploy_ed25519 -o IdentitiesOnly=yes \
            "${{ steps.package.outputs.archive_path }}" \
            "${{ secrets.PROD_SSH_USER }}@${{ secrets.PROD_SSH_HOST }}:/tmp/portal-${{ steps.release.outputs.release_id }}.tar.gz"

      - name: Install release on server
        run: |
          ssh -i ~/.ssh/portal_live_deploy_ed25519 -o IdentitiesOnly=yes "${{ secrets.PROD_SSH_USER }}@${{ secrets.PROD_SSH_HOST }}" \
            "APP_ROOT='${{ secrets.PROD_APP_ROOT }}' RELEASE_ID='${{ steps.release.outputs.release_id }}' ARCHIVE_PATH='/tmp/portal-${{ steps.release.outputs.release_id }}.tar.gz' bash -s" \
            < scripts/install-release.sh

      - name: Run smoke checks
        env:
          BASE_URL: ${{ secrets.PROD_BASE_URL }}
        run: bash scripts/release-smoke.sh
